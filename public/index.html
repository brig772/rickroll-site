<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>root@terminal — access</title>
  <style>
    :root {
      --bg: #05080a;
      --green: #33ff66;
      --green-dim: #1f9c3f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--green);
      font-family: "Cascadia Code", "Consolas", "Courier New", monospace;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .term {
      width: 100%;
      max-width: 720px;
      background: rgba(0,0,0,0.55);
      border: 1px solid var(--green-dim);
      border-radius: 8px;
      box-shadow: 0 0 40px rgba(51,255,102,0.15);
      overflow: hidden;
    }
    .bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #0b1016;
      border-bottom: 1px solid var(--green-dim);
    }
    .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
    .r { background:#ff5f56; } .y { background:#ffbd2e; } .g { background:#27c93f; }
    .bar span { margin-left: 8px; color: var(--green-dim); font-size: 13px; }
    .screen {
      padding: 20px;
      min-height: 240px;
      font-size: 15px;
      line-height: 1.7;
    }
    .line { white-space: pre-wrap; word-break: break-word; }
    .prompt { color: var(--green-dim); }
    .cursor {
      display: inline-block;
      width: 9px;
      height: 17px;
      background: var(--green);
      vertical-align: middle;
      animation: blink 1s steps(2, start) infinite;
    }
    @keyframes blink { to { visibility: hidden; } }
    .dl {
      display: inline-block;
      margin-top: 18px;
      padding: 14px 22px;
      background: transparent;
      color: var(--green);
      border: 1px solid var(--green);
      border-radius: 6px;
      font-family: inherit;
      font-size: 15px;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .dl:hover, .dl:active { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(51,255,102,0.5); }
    .hint { margin-top: 14px; color: var(--green-dim); font-size: 13px; }

    /* Mobile tuning */
    @media (max-width: 600px) {
      body { align-items: flex-start; padding: 12px; }
      .screen { font-size: 13px; padding: 16px; min-height: 200px; }
      .dl { display: block; text-align: center; font-size: 16px; padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="term">
    <div class="bar">
      <div class="dot r"></div>
      <div class="dot y"></div>
      <div class="dot g"></div>
      <span id="barlabel">cmd.exe</span>
    </div>
    <div class="screen">
      <div class="line" id="out"></div>
      <div id="controls" style="display:none;"></div>
    </div>
  </div>

  <script>
    var VIDEO = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";

    // Detect touch / mobile devices — they can't run a .bat, so rickroll them in-browser.
    var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)
      || (('ontouchstart' in window) && window.matchMedia && window.matchMedia("(max-width: 820px)").matches);

    var linesDesktop = [
      "> initializing connection...",
      "> establishing secure channel [OK]",
      "> locating payload...",
      "> payload ready.",
      "",
      "> awaiting user confirmation_"
    ];
    var linesMobile = [
      "> initializing connection...",
      "> mobile device detected",
      "> loading media stream...",
      "> stream ready.",
      "",
      "> awaiting user confirmation_"
    ];

    var lines = isMobile ? linesMobile : linesDesktop;
    var out = document.getElementById("out");
    var controls = document.getElementById("controls");
    if (isMobile) document.getElementById("barlabel").textContent = "terminal";
    var i = 0;

    function showControls() {
      out.innerHTML += '<span class="cursor"></span>';
      if (isMobile) {
        var a = document.createElement("a");
        a.className = "dl";
        a.href = VIDEO;
        a.textContent = "[ tap to run ]";
        a.setAttribute("rel", "noopener");
        a.onclick = function () { window.location.href = VIDEO; };
        controls.appendChild(a);
        var h = document.createElement("div");
        h.className = "hint";
        h.textContent = "tap to execute";
        controls.appendChild(h);
      } else {
        controls.innerHTML =
          '<a class="dl" href="rickroll.bat" download>[ download payload.bat ]</a>' +
          '<div class="hint">Then double-click the downloaded file to run it.</div>';
      }
      controls.style.display = "block";
    }

    function typeLine() {
      if (i >= lines.length) { showControls(); return; }
      var raw = lines[i];
      var p = raw.charAt(0) === ">" ? '<span class="prompt">&gt;</span>' + raw.slice(1) : raw;
      out.innerHTML += p + "\n";
      i++;
      setTimeout(typeLine, 450);
    }
    typeLine();
  </script>
</body>
</html>
